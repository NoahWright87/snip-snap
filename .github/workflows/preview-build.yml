name: Preview Build (Windows)

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/preview-build.yml"

jobs:
  notify-start:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { upsertComment } = require('./.github/scripts/pr-comment.js')
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await upsertComment({
              github,
              context,
              body: [
                '## 🔨 Windows preview build (unsigned)',
                '',
                `Build started - [view live logs](${runUrl}).`,
              ].join('\n'),
            })

  build-windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build standalone executable
        working-directory: backend
        run: >
          pyinstaller --onefile --windowed --name snip-snap
          --add-data "../frontend/dist;frontend_dist"
          --collect-all uvicorn
          --collect-all pydantic
          --collect-all pydantic_core
          --paths .
          --noconfirm
          launcher.py

      - name: Build unsigned preview installer
        shell: pwsh
        run: |
          $previewVersion = "0.0.${{ github.event.pull_request.number }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" backend\packaging\windows\snip-snap.iss /DAppVersion=$previewVersion

      - name: Assemble preview package
        working-directory: backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path preview | Out-Null
          Copy-Item dist/snip-snap.exe preview/snip-snap.exe
          Copy-Item packaging/windows/output/snip-snap-setup-0.0.${{ github.event.pull_request.number }}.exe preview/snip-snap-preview-setup.exe
          Copy-Item packaging/PREVIEW_README.txt preview/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: snip-snap-preview-unsigned-pr${{ github.event.pull_request.number }}
          path: backend/preview
          retention-days: 14

  notify-finish:
    runs-on: ubuntu-latest
    needs: [notify-start, build-windows-preview]
    if: always()
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { upsertComment } = require('./.github/scripts/pr-comment.js')
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const result = '${{ needs.build-windows-preview.result }}'

            if (result === 'success') {
              const artifactName = `snip-snap-preview-unsigned-pr${context.issue.number}`
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              })
              const artifact = data.artifacts.find((a) => a.name === artifactName)
              const artifactUrl = artifact ? `${runUrl}/artifacts/${artifact.id}` : runUrl

              await upsertComment({
                github,
                context,
                body: [
                  '## ✅ Windows preview build ready (unsigned)',
                  '',
                  `📦 [Download ${artifactName}.zip](${artifactUrl})`,
                  '⚠️ Preview artifacts are for PR testing and are unsigned.',
                  'Included in the zip: `snip-snap.exe` and `snip-snap-preview-setup.exe`.',
                  `📋 [Build log](${runUrl})`,
                ].join('\n'),
              })
            } else {
              const cancelled = result === 'cancelled'
              await upsertComment({
                github,
                context,
                body: [
                  `## ${cancelled ? '⚪' : '❌'} Windows preview build ${cancelled ? 'cancelled' : 'failed'}`,
                  '',
                  `📋 [View build log](${runUrl}) for details.`,
                ].join('\n'),
              })
            }
