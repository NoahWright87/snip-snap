name: Preview Build (Windows)

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/preview-build.yml"

jobs:
  build-windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Build standalone executable
        working-directory: backend
        run: >
          pyinstaller --onefile --name snip-snap
          --add-data "../frontend/dist;frontend_dist"
          --collect-all uvicorn
          --collect-all pydantic
          --collect-all pydantic_core
          --paths .
          --noconfirm
          launcher.py

      - name: Assemble preview package
        working-directory: backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path preview | Out-Null
          Copy-Item dist/snip-snap.exe preview/snip-snap.exe
          Copy-Item packaging/PREVIEW_README.txt preview/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: snip-snap-preview-pr${{ github.event.pull_request.number }}
          path: backend/preview
          retention-days: 14
